name: EAS Update (preview + Expo Go)

# Every push to main publishes the JS bundle as over-the-air updates:
#  - channel "preview": installed preview builds download it on the next app start
#    (only builds with the same native fingerprint; after changing native
#    dependencies run the "EAS build" workflow again);
#  - channel "expo-go": runtime "exposdk:<SDK>" so it opens in Expo Go
#    (Expo Go -> Projects -> repcounter -> expo-go). In Expo Go the app uses the
#    WebView + MediaPipe pose engine, because Expo Go lacks the native modules.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - name: eas update
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: eas update --channel preview --environment preview --message "$MESSAGE" --non-interactive
      - name: eas update (Expo Go)
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
          EXPO_GO_UPDATE: '1'
        run: eas update --channel expo-go --environment preview --message "$MESSAGE" --non-interactive
