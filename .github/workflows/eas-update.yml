name: EAS Update (preview channel)

# Every push to main publishes the JS bundle as an over-the-air update to the
# "preview" channel. Installed preview builds download it on the next app start.
# Updates only reach builds with the same runtime (native fingerprint); after
# changing native dependencies, run the "EAS build" workflow again.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - name: eas update
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: eas update --channel preview --environment preview --message "$MESSAGE" --non-interactive
